[project]
name = "fieldnote"
version = "0.1.0"
description = "Multimodal RAG for HVAC field technicians: retrieve across manual charts, job-site photos and support calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "google-genai>=1.30",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "truststore>=0.10",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Heavy model dependencies are kept out of the core install so CI stays fast.
ml = [
    "faster-whisper>=1.0",
    "protobuf>=5",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.66",
    "transformers>=4.51",
]
app = ["streamlit>=1.38"]

[project.scripts]
fieldnote = "fieldnote.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldnote"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
